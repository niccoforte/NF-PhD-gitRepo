name: Guidance integrity

on:
  pull_request:
  push:

jobs:
  check-guidance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate changed repository surface and guidance coverage
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="$PR_BASE"
          if [ -z "$base" ]; then
            base="$PUSH_BASE"
          fi
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$base^{commit}"; then
            python .agents/skills/validate-repo-change/scripts/validate_repo.py --base-ref "$base"
          else
            python .agents/skills/validate-repo-change/scripts/validate_repo.py --scope root
          fi
